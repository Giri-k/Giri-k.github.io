<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found · Girishkaushik Karthikeyan</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/main.css?v=2026-11-12c">
  <script>try{var t=localStorage.getItem('theme');if(t)document.documentElement.dataset.theme=t;}catch(e){}</script>
  <style>
    /* 404: a small terminal window with a friendly way home. */
    .nf { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; }
    .nf .window { width: min(620px, 100%); }
    .nf .body { padding: 22px 24px 26px; font-family: var(--mono); font-size: 14.5px; }
    .nf .err { color: var(--danger); }
    .nf h1 { font-family: var(--sans); font-size: 30px; margin: 18px 0 8px; }
    .nf p { font-family: var(--sans); color: var(--fg-dim); margin: 0 0 20px; }
  </style>
</head>
<body>
  <main class="nf">
    <div class="window">
      <div class="titlebar"><span class="dots"><i></i><i></i><i></i></span><span class="title">girish@ut-austin: ~</span></div>
      <div class="body">
        <div><span class="accent">girish@ut-austin</span>:~$ cd <span id="path"></span></div>
        <div class="err">bash: no such file or directory</div>
        <h1>This page doesn't exist.</h1>
        <p>The link may be old or mistyped.</p>
        <a class="btn primary" href="/">← Back to the home page</a>
      </div>
    </div>
  </main>
  <script>document.getElementById("path").textContent = location.pathname;</script>
</body>
